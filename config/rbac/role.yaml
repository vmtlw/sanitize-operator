---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - sanitize.sanitize.dev
  resources:
  - sanitizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sanitize.sanitize.dev
  resources:
  - sanitizers/finalizers
  verbs:
  - update
- apiGroups:
  - sanitize.sanitize.dev
  resources:
  - sanitizers/status
  verbs:
  - get
  - patch
  - update
